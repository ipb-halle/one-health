spring.neo4j.uri=bolt://graphdb:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password


spring.datasource.url=jdbc:postgresql://postgredb:5432/one_health
spring.datasource.username=one_health_user
spring.datasource.password=one_health_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true 

logging.level.org.springframework.data.neo4j.cypher.deprecation=OFF
logging.level.org.springframework.data.neo4j.cypher.unrecognized=OFF


spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1600000
spring.datasource.hikari.leak-detection-threshold=10000

orcid.client-id=${ORCID_CLIENT_ID:}
orcid.client-secret: ${ORCID_CLIENT_SECRET:}
orcid.authorize-url=${ORCID_AUTHORIZE_URL:https://orcid.org/oauth/authorize}
orcid.token-url: ${ORCID_TOKEN_URL:https://orcid.org/oauth/token}
orcid.redirect-uri=${ORCID_REDIRECT_URI:http://a.localhost:5174/auth/orcid/callback}

jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
jwt.expiration-seconds=86400