services:
  server:
    container_name: one-health-server
    build:
      context: .
      dockerfile: ./docker/server/server.Dockerfile
    # TODO: expose for debuging purposes only 
    ports:
      - "5174:8080"
    networks:
      - one-health-network
    depends_on:
      postgredb:
        condition: service_healthy # ensures the correct start of postgredb
      graphdb:
        condition: service_healthy

  client:
    container_name: one-health-client
    build:
      context: .
      dockerfile: ./docker/client/client.Dockerfile
    ports:
      - "80:80"
      - "5180:80"
    # - "443:443"
    hostname: www.example.com
    networks:
      - one-health-network
      #- frontend
    volumes:
      - /srv/www/conf:/usr/local/apache2/conf
      - /srv/www/letsencrypt/.well-known:/usr/local/apache2/htdocs/.well-known
    depends_on:
      - server

  graphdb:
    container_name: one-health-graphdb
    image: neo4j
    # expose graphdb ports for debugging only
    ports:
      - "7474:7474"
      - "7687:7687" # for BOLT-Protocol
    networks:
      - one-health-network
    volumes:
      - onehealth_neo4j:/var/lib/neo4j/data
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:7474" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  postgredb:
    container_name: one-health-postgredb
    build:
      context: .
      dockerfile: ./docker/rdkit/rdkit.Dockerfile
    networks:
      - one-health-network
    volumes:
      - onehealth_pgsql:/var/lib/postgresql/data
      #- pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: one_health_user
      POSTGRES_PASSWORD: one_health_password
      POSTGRES_DB: one_health
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U one_health_user -d one_health" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

networks:
  one-health-network:
    driver: bridge

volumes:
  onehealth_pgsql:
    external: true
    name: onehealth_pgsql
  onehealth_neo4j:
    external: true
    name: onehealth_neo4j
